name: Update News

on:
  schedule:
    # 매 시간 정각에 실행 (UTC 기준)
    - cron: '0 * * * *'
  workflow_dispatch:
    # 수동 실행 가능

jobs:
  collect-news:
    runs-on: ubuntu-latest

    steps:
      - name: Wake up Render server
        run: |
          echo "Waking up Render server..."
          curl -s --max-time 120 "https://news-dashboard-v9ve.onrender.com/" > /dev/null || true
          echo "Waiting for server to be ready..."
          sleep 10

      - name: Collect News
        run: |
          echo "Starting news collection at $(date)"

          # 최대 3번 재시도
          for i in 1 2 3; do
            echo "Attempt $i..."
            response=$(curl -s --max-time 120 -w "\n%{http_code}" "https://news-dashboard-v9ve.onrender.com/api/collect")
            http_code=$(echo "$response" | tail -n1)
            body=$(echo "$response" | sed '$d')

            echo "Response: $body"
            echo "HTTP Status: $http_code"

            if [ "$http_code" -eq 200 ]; then
              echo "News collection successful!"
              exit 0
            fi

            echo "Attempt $i failed, waiting 15 seconds..."
            sleep 15
          done

          echo "All attempts failed"
          exit 1
